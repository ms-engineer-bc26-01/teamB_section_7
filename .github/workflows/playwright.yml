name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start backend
        working-directory: ./backend
        env:
          MONGO_URI: mongodb://localhost:27017/potluck_test
          JWT_SECRET: test-secret
          PYTHONPATH: .
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &

      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:8000/ --timeout 60000

      - name: Check backend startup logs on failure
        if: failure()
        run: |
          echo "=== Backend startup logs ==="
          cat /tmp/backend.log || echo "No log file found"
          echo "=== Running processes ==="
          ps aux | grep uvicorn || echo "No uvicorn process found"

      - name: Run Playwright tests
        env:
          MONGO_URI: mongodb://localhost:27017/potluck_test
          JWT_SECRET: test-secret
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
